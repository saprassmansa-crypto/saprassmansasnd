<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAPRAS - SMA Negeri 1 Seunuddon</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#1e293b;margin:0}
  .hide{display:none!important}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  @media print{.noprint{display:none!important} body{background:#fff} .print-header{display:block!important} table{font-size:10px} thead{display:table-header-group} tr{page-break-inside:avoid} .print-signature{page-break-inside:avoid} @page{size:A4;margin:12mm}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8">
    <div class="w-14 h-14 bg-blue-800 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white"><i data-lucide="building-2" class="w-7 h-7"></i></div>
    <h1 class="text-center font-black text-xl text-slate-800">SAPRAS</h1>
    <p class="text-center text-xs font-bold text-slate-400 uppercase tracking-widest mb-6">SMA Negeri 1 Seunuddon</p>
    <label class="text-[11px] font-bold text-slate-500 uppercase">Username</label>
    <input id="lg-user" class="w-full mt-1 mb-3 p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-600" placeholder="admin">
    <label class="text-[11px] font-bold text-slate-500 uppercase">Password</label>
    <input id="lg-pass" type="password" class="w-full mt-1 mb-4 p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-600" placeholder="••••••••">
    <div id="lg-msg" class="text-xs text-red-600 font-bold mb-3 text-center"></div>
    <button onclick="doLogin()" class="w-full bg-blue-800 text-white font-black py-3 rounded-xl hover:bg-blue-900 transition">MASUK</button>
    <p class="text-center text-[10px] text-slate-400 mt-5">Akun awal: admin/admin123, petugas/petugas123, kepsek/kepsek123</p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hide min-h-screen flex">
  <aside class="w-64 bg-blue-900 text-white flex-col p-5 hidden lg:flex noprint">
    <div class="flex items-center gap-3 mb-8">
      <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center"><i data-lucide="building-2" class="w-5 h-5"></i></div>
      <div><h1 class="font-black text-lg leading-tight">SAPRAS</h1><p class="text-[10px] text-blue-200 uppercase tracking-widest">Sarana Prasarana</p></div>
    </div>
    <nav id="nav" class="flex-1 space-y-1 overflow-y-auto"></nav>
    <div class="pt-4 border-t border-white/10 mt-4">
      <p class="text-xs font-bold" id="who"></p>
      <button onclick="logout()" class="mt-2 w-full bg-red-600/90 hover:bg-red-600 text-xs font-black py-2 rounded-lg">KELUAR</button>
    </div>
  </aside>

  <nav id="mobnav" class="lg:hidden fixed bottom-0 left-0 right-0 bg-blue-900 z-40 flex overflow-x-auto noprint"></nav>

  <main class="flex-1 overflow-y-auto h-screen pb-20 lg:pb-0">
    <header class="bg-white border-b border-slate-200 px-5 py-4 flex justify-between items-center sticky top-0 z-30 noprint">
      <div><p class="text-[11px] font-bold text-blue-700 uppercase tracking-widest" id="hdr-sub">SMA Negeri 1 Seunuddon</p><h2 class="text-xl font-black text-slate-800" id="hdr-title">Dashboard</h2></div>
      <button onclick="logout()" class="lg:hidden text-slate-400"><i data-lucide="log-out"></i></button>
    </header>
    <div id="view" class="p-4 md:p-6 max-w-6xl mx-auto"></div>
  </main>
</div>

<!-- ============ MODAL GENERIC ============ -->
<div id="modal" class="hide fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 noprint">
  <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6" id="modal-body"></div>
</div>

<script>
//================= CONFIG =================
const GAS_URL = "https://script.google.com/macros/s/AKfycbyqPCxUw-O_-On53WxZRMXcXioBNlXl00RvtaS-BknJ4hNoF6-a_hzJIYPt4R8jnhpAnQ/exec";

let S = JSON.parse(sessionStorage.getItem("sapras_session") || "null");
let D = { settings:{}, assets:[], categories:[], locations:[], mutations:[], loans:[], maintenance:[], disposals:[], dashboard:{} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rupiah = n => "Rp " + (Number(n)||0).toLocaleString("id-ID");
const icons = () => { try { lucide.createIcons(); } catch(e){} };

function toast(msg, isError){ Swal.mixin({toast:true,position:"top-end",showConfirmButton:false,timer:3000}).fire({icon:isError?"error":"success",title:msg}); }
function loading(show, text){ if(show) Swal.fire({title:text||"Memproses...",allowOutsideClick:false,allowEscapeKey:false,showConfirmButton:false,didOpen:()=>Swal.showLoading()}); else Swal.close(); }
function openModal(html){ $("modal-body").innerHTML = html; $("modal").classList.remove("hide"); icons(); }
function closeModal(){ $("modal").classList.add("hide"); }

//================= API =================
async function api(action, extra){
  if(GAS_URL.includes("PASTE_URL_WEBAPP")){ toast("GAS_URL belum diisi di index.html", true); throw new Error("config"); }
  const body = Object.assign({ action: action, currentUserId: S?.user?.id, currentUserRole: S?.user?.role, currentUserName: S?.user?.nama }, extra||{});
  let res, json;
  try {
    res = await fetch(GAS_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(body) });
    json = await res.json();
  } catch(err){
    toast("Gagal menghubungi server. Periksa URL Apps Script / koneksi internet.", true);
    throw err;
  }
  if(json.status === "error"){ toast(json.message || "Terjadi kesalahan server.", true); throw new Error(json.message); }
  return json;
}

//================= LOGIN / LOGOUT =================
async function doLogin(){
  const username = $("lg-user").value.trim(), password = $("lg-pass").value.trim();
  if(!username || !password){ $("lg-msg").textContent = "Isi username dan password."; return; }
  $("lg-msg").textContent = "";
  loading(true, "Memeriksa akun...");
  try {
    const j = await api("login", { username, password });
    S = { user: j.data };
    sessionStorage.setItem("sapras_session", JSON.stringify(S));
    await boot();
  } catch(e){ $("lg-msg").textContent = e.message || "Gagal masuk."; }
  loading(false);
}
function logout(){ S = null; sessionStorage.removeItem("sapras_session"); $("app").classList.add("hide"); $("login").classList.remove("hide"); }

//================= NAV =================
const MENU = [
  { id:"dashboard", label:"Dashboard", icon:"layout-dashboard", roles:null },
  { id:"aset", label:"Aset", icon:"box", roles:null, group:true, children:[
    {id:"aset-data", label:"Data Aset", action:"aset"},
    {id:"aset-import", label:"Import File", action:"aset-import"},
    {id:"aset-template", label:"Template", action:"aset-template"}
  ]},
  { id:"kib", label:"KIB", icon:"layers", roles:null, group:true, children:[
    {id:"kibA", label:"KIB A – Tanah", action:"kibA"},
    {id:"kibB", label:"KIB B – Peralatan dan Mesin", action:"kibB"},
    {id:"kibC", label:"KIB C – Gedung dan Bangunan", action:"kibC"},
    {id:"kibD", label:"KIB D – Jalan, Irigasi dan Jaringan", action:"kibD"},
    {id:"kibE", label:"KIB E – Aset Tetap Lainnya", action:"kibE"},
    {id:"kibF", label:"KIB F – Konstruksi Dalam Pengerjaan", action:"kibF"}
  ]},
  { id:"kir", label:"KIR", icon:"door-open", roles:null, group:true, children:[
    {id:"kir-data", label:"Kartu Inventaris Ruangan", action:"kir"}
  ]},
  { id:"kategori", label:"Kategori", icon:"tags", roles:null },
  { id:"lokasi", label:"Lokasi", icon:"map-pin", roles:null },
  { id:"mutasi", label:"Mutasi Aset", icon:"move", roles:null },
  { id:"peminjaman", label:"Peminjaman", icon:"handshake", roles:null },
  { id:"pemeliharaan", label:"Pemeliharaan", icon:"wrench", roles:null },
  { id:"penghapusan", label:"Penghapusan", icon:"trash-2", roles:null },
  { id:"laporan", label:"Laporan", icon:"file-text", roles:null },
  { id:"pengguna", label:"Pengguna", icon:"users", roles:["ADMIN"] },
  { id:"pengaturan", label:"Pengaturan", icon:"settings", roles:["ADMIN"] },
  { id:"sinkron", label:"Sinkronisasi", icon:"refresh-cw", roles:null }
];
let activeTab = "dashboard";

function canWrite(){ return S.user.role === "ADMIN" || S.user.role === "PETUGAS"; }
function isAdmin(){ return S.user.role === "ADMIN"; }

function groupButton(m, mobile=false){
  const base = mobile
    ? "flex flex-col items-center justify-center min-w-[74px] py-2 text-blue-200 text-[9px] font-bold gap-1"
    : "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-blue-100 hover:bg-white/10 transition";
  return `<button type="button" onclick="toggleMenuGroup('${m.id}')" class="${base}"><i data-lucide="${m.icon}" class="w-4 h-4"></i><span>${m.label}</span></button>`;
}
function renderGroupChildren(m, mobile=false){
  const wrap = mobile ? `id="mob-group-${m.id}" class="hidden flex-col bg-blue-950/60"` : `id="group-${m.id}" class="hidden pl-3 mt-1 space-y-1"`;
  return `<div ${wrap}>${m.children.map(c=>`<button type="button" onclick="switchTab('${c.action}')" id="${mobile?'mnav-':'nav-'}${c.id}" class="${mobile?'flex items-center gap-2 px-3 py-2 min-w-full text-left text-[10px] text-blue-100':'w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-blue-200 hover:bg-white/10'}"><span class="opacity-60">└</span>${c.label}</button>`).join('')}</div>`;
}
function renderNav(){
  const items = MENU.filter(m => !m.roles || m.roles.includes(S.user.role));
  $("nav").innerHTML = items.map(m => m.group ? groupButton(m)+renderGroupChildren(m) : `<button type="button" onclick="switchTab('${m.id}')" id="nav-${m.id}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-blue-100 hover:bg-white/10 transition"><i data-lucide="${m.icon}" class="w-4 h-4"></i>${m.label}</button>`).join("");
  $("mobnav").innerHTML = items.map(m => m.group ? groupButton(m,true)+renderGroupChildren(m,true) : `<button type="button" onclick="switchTab('${m.id}')" id="mnav-${m.id}" class="flex flex-col items-center justify-center min-w-[74px] py-2 text-blue-200 text-[9px] font-bold gap-1"><i data-lucide="${m.icon}" class="w-4 h-4"></i>${m.label}</button>`).join("");
  icons();
}
function toggleMenuGroup(id){
  const a=$("group-"+id), b=$("mob-group-"+id);
  if(a) a.classList.toggle("hidden");
  if(b) b.classList.toggle("hidden");
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('[id^="nav-"],[id^="mnav-"]').forEach(b => b.className = b.className.replace(" bg-white/20","").replace(" text-white"," text-blue-100").trim());
  const navBtn = $("nav-"+tab), mBtn = $("mnav-"+tab);
  if(navBtn) navBtn.className += " bg-white/20 text-white";
  if(mBtn) mBtn.className += " bg-white/20 text-white";
  const titles = {
    dashboard:"Dashboard", aset:"Data Aset", "aset-import":"Import Data Aset", "aset-template":"Template Import Aset",
    kibA:"KIB A – Tanah", kibB:"KIB B – Peralatan dan Mesin", kibC:"KIB C – Gedung dan Bangunan",
    kibD:"KIB D – Jalan, Irigasi dan Jaringan", kibE:"KIB E – Aset Tetap Lainnya", kibF:"KIB F – Konstruksi Dalam Pengerjaan",
    kir:"KIR – Kartu Inventaris Ruangan", kategori:"Kategori Barang", lokasi:"Data Lokasi", mutasi:"Mutasi Aset",
    peminjaman:"Peminjaman Aset", pemeliharaan:"Pemeliharaan Aset", penghapusan:"Usulan Penghapusan", laporan:"Laporan",
    pengguna:"Manajemen Pengguna", pengaturan:"Pengaturan Sekolah", sinkron:"Sinkronisasi Database"
  };
  $("hdr-title").textContent = titles[tab] || "Dashboard";
  $("hdr-sub").textContent = D.settings.NamaSekolah || "SMA Negeri 1 Seunuddon";
  if(tab.startsWith("kib") && /^kib[A-F]$/.test(tab)) return viewKIB(tab.slice(-1));
  if(tab === "aset-import") { viewAset(); viewAsetTab("import"); return; }
  if(tab === "aset-template") { viewAset(); viewAsetTab("template"); return; }
  RENDER[tab] ? RENDER[tab]() : $("view").innerHTML = "";
}

//================= BOOT =================
async function boot(){
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  $("who").textContent = S.user.nama + " · " + S.user.role;
  renderNav();
  loading(true, "Memuat data dari Spreadsheet...");
  try {
    const j = await api("syncData");
    D = j.data;
  } catch(e) { /* toast sudah ditampilkan oleh api() */ }
  loading(false);
  switchTab("dashboard");
}
async function refreshAll(){ const j = await api("syncData"); D = j.data; }

//================= DASHBOARD =================
function viewDashboard(){
  const d = D.dashboard || {};
  const card = (icon,label,val,color) => `<div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100"><div class="w-9 h-9 rounded-xl flex items-center justify-center mb-2" style="background:${color}1a;color:${color}"><i data-lucide="${icon}" class="w-5 h-5"></i></div><p class="text-[10px] font-bold text-slate-400 uppercase tracking-wide">${label}</p><p class="text-2xl font-black text-slate-800">${val}</p></div>`;
  const rows = o => Object.entries(o||{}).map(([k,v])=>`<div class="flex justify-between text-sm py-1.5 border-b border-slate-50"><span class="text-slate-500">${esc(k)}</span><b>${v}</b></div>`).join("") || '<p class="text-sm text-slate-400">Belum ada data.</p>';
  $("view").innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      ${card("box","Total Aset",d.totalAset||0,"#1e40af")}
      ${card("check-circle","Kondisi Baik",d.kondisiBaik||0,"#059669")}
      ${card("alert-triangle","Rusak Ringan",d.rusakRingan||0,"#d97706")}
      ${card("x-circle","Rusak Berat",d.rusakBerat||0,"#dc2626")}
      ${card("wallet","Total Nilai",rupiah(d.totalNilaiAset),"#7c3aed")}
      ${card("tags","Kategori",d.jumlahKategori||0,"#0891b2")}
      ${card("map-pin","Lokasi",d.jumlahLokasi||0,"#0891b2")}
      ${card("handshake","Sedang Dipinjam",d.totalDipinjam||0,"#be123c")}
    </div>
    <div class="grid md:grid-cols-3 gap-4">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100"><h4 class="font-black text-sm text-slate-700 mb-2">Kondisi Aset</h4>${rows(d.charts && d.charts.byCondition)}</div>
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100"><h4 class="font-black text-sm text-slate-700 mb-2">Per Kategori</h4>${rows(d.charts && d.charts.byCategory)}</div>
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100"><h4 class="font-black text-sm text-slate-700 mb-2">Per Lokasi</h4>${rows(d.charts && d.charts.byLocation)}</div>
    </div>`;
  icons();
}

//================= ASET =================
function viewAset(){
  $("view").innerHTML = `
    <div class="bg-white rounded-2xl p-3 mb-4 shadow-sm border border-slate-100 noprint">
      <div class="flex flex-wrap gap-2">
        <button onclick="viewAsetTab('data')" id="aset-tab-data" class="px-4 py-2 rounded-lg bg-blue-800 text-white text-sm font-black">Data Aset</button>
        ${canWrite()?`<button onclick="viewAsetTab('import')" id="aset-tab-import" class="px-4 py-2 rounded-lg bg-slate-100 text-sm font-bold">Import File</button>`:""}
        <button onclick="viewAsetTab('template')" id="aset-tab-template" class="px-4 py-2 rounded-lg bg-slate-100 text-sm font-bold">Template</button>
      </div>
    </div>
    <div id="aset-content"></div>`;
  viewAsetTab('data'); icons();
}
function viewAsetTab(tab){
  document.querySelectorAll('[id^="aset-tab-"]').forEach(b=>b.className='px-4 py-2 rounded-lg bg-slate-100 text-sm font-bold');
  const active=$("aset-tab-"+tab); if(active) active.className='px-4 py-2 rounded-lg bg-blue-800 text-white text-sm font-black';
  if(tab==='data') $("aset-content").innerHTML=`
    <div class="flex flex-wrap gap-2 mb-4 justify-between items-center noprint"><input id="q-aset" oninput="renderAsetList()" placeholder="🔍 Cari nama, kode, kategori, lokasi..." class="flex-1 min-w-[220px] p-3 bg-white border border-slate-200 rounded-xl outline-none">${canWrite()?`<button onclick="formAset()" class="bg-blue-800 text-white font-black text-sm px-4 py-3 rounded-xl">＋ Tambah Aset</button>`:""}</div>
    <div id="list-aset" class="space-y-2"></div>`;
  else if(tab==='import') $("aset-content").innerHTML=`
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100"><h3 class="font-black text-lg mb-2">Import Data Aset</h3><p class="text-sm text-slate-500 mb-4">Upload Excel/CSV, periksa preview dan validasi, lalu konfirmasi import.</p><input id="import-file" type="file" accept=".xlsx,.xls,.csv" class="w-full p-3 bg-slate-50 border rounded-xl mb-3" onchange="previewImportFile()"><div id="import-preview"></div></div>`;
  else $("aset-content").innerHTML=`<div class="bg-white rounded-2xl p-6 shadow-sm"><h3 class="font-black text-lg mb-2">Template Import Aset</h3><p class="text-sm text-slate-500 mb-4">Template mengikuti struktur import yang didukung aplikasi.</p><button onclick="downloadTemplate()" class="bg-blue-800 text-white font-black px-5 py-3 rounded-xl">⬇ Download Template Excel</button></div>`;
  if(tab==='data') renderAsetList(); icons();
}
async function previewImportFile(){
  const f=$("import-file").files[0]; if(!f) return;
  loading(true,'Membaca file...');
  try{
    const data=await f.arrayBuffer(); const wb=XLSX.read(data,{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
    window._importRows=rows;
    const keys=rows.length?Object.keys(rows[0]):[];
    $("import-preview").innerHTML=`<div class="text-xs text-slate-500 mb-3">${rows.length} baris ditemukan. Kolom: ${keys.map(esc).join(', ')}</div><div class="overflow-auto border rounded-xl max-h-80"><table class="w-full text-xs border-collapse"><thead><tr>${keys.map(k=>`<th class="p-2 border bg-slate-100 text-left">${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,20).map(r=>`<tr>${keys.map(k=>`<td class="p-2 border">${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><button onclick="confirmImport()" class="mt-4 bg-emerald-700 text-white font-black px-5 py-3 rounded-xl">✓ Validasi & Import</button>`;
  }catch(e){toast('File tidak dapat dibaca: '+e.message,true);}finally{loading(false)}
}
async function confirmImport(){
  if(!window._importRows?.length){toast('Belum ada data import.',true);return;}
  const c=await Swal.fire({title:'Konfirmasi Import',text:`Import ${window._importRows.length} baris ke database?`,icon:'question',showCancelButton:true,confirmButtonText:'Ya, Import',cancelButtonText:'Batal'}); if(!c.isConfirmed)return;
  loading(true,'Mengimport data aset...'); try{const r=await api('importAssets',{rows:window._importRows}); await refreshAll(); await Swal.fire({icon:'success',title:'Import selesai',html:`Valid: <b>${r.data.valid}</b><br>Invalid: <b>${r.data.invalid}</b><br>Duplikat: <b>${r.data.duplicate}</b>`}); viewAsetTab('data');}catch(e){}finally{loading(false)}
}
async function downloadTemplate(){
  const headers=(await api('getImportTemplate')).data||[]; const ws=XLSX.utils.aoa_to_sheet([headers]); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Template Aset'); XLSX.writeFile(wb,'Template_Import_Aset_SAPRAS.xlsx');
}

function renderAsetList(){
  const q = ($("q-aset").value||"").toLowerCase();
  const rows = D.assets.filter(a => a.Status !== "Dihapus" && [a.NamaBarang,a.KodeBarang,a.Kategori,a.Lokasi].join(" ").toLowerCase().includes(q));
  $("list-aset").innerHTML = rows.length ? rows.map(a => `
    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 flex flex-wrap gap-3 justify-between items-start">
      <div class="flex-1 min-w-[200px]">
        <b class="text-slate-800">${esc(a.NamaBarang)}</b>
        <span class="ml-2 text-[10px] font-black px-2 py-0.5 rounded-full ${a.Kondisi==='Baik'?'bg-green-100 text-green-700':a.Kondisi==='Rusak Ringan'?'bg-amber-100 text-amber-700':'bg-red-100 text-red-700'}">${esc(a.Kondisi)}</span>
        ${a.Status==='Dipinjam'?'<span class="ml-1 text-[10px] font-black px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">DIPINJAM</span>':''}
        <div class="text-xs text-slate-500 mt-1">Kode: ${esc(a.KodeBarang||'-')} · ${esc(a.Kategori)} · ${esc(a.Lokasi)} · Jml: ${esc(a.Jumlah)} ${esc(a.Satuan||'')}</div>
      </div>
      <div class="flex gap-2 flex-wrap">
        <button onclick="printBarcode('${esc(a.KodeBarang)}','${esc(a.NamaBarang)}')" class="text-xs font-bold bg-slate-100 px-3 py-2 rounded-lg">🖨 Barcode</button>
        ${canWrite()?`<button onclick="formAset('${a.ID}')" class="text-xs font-bold bg-blue-50 text-blue-700 px-3 py-2 rounded-lg">Edit</button>`:""}
        ${isAdmin()?`<button onclick="delAset('${a.ID}')" class="text-xs font-bold bg-red-50 text-red-700 px-3 py-2 rounded-lg">Hapus</button>`:""}
      </div>

async function saveAset(id){
  const kat = D.categories.find(x=>x.ID===$("f-kat").value), lok = D.locations.find(x=>x.ID===$("f-lok").value);
  if(!$("f-nama").value.trim() || !kat || !lok){ toast("Nama, kategori, dan lokasi wajib diisi.", true); return; }
  const asset = { KodeBarang: $("f-kode").value.trim(), NamaBarang: $("f-nama").value.trim(), KategoriID: kat.ID, Kategori: kat.NamaKategori, LokasiID: lok.ID, Lokasi: lok.NamaLokasi, Jumlah: $("f-jml").value, Satuan: $("f-sat").value, Kondisi: $("f-kon").value, TahunPerolehan: $("f-thn").value, SumberDana: $("f-dana").value, HargaPerolehan: $("f-harga").value, Keterangan: $("f-ket").value.trim(), KIB: $("f-kib").value };
  if(id) asset.ID = id;
  loading(true, "Menyimpan...");
  try {
    const file = $("f-foto").files[0];
    if(file){
      const base64 = await fileToBase64(file);
      const up = await api("uploadFile", { fileName: file.name, base64Data: base64, folderType: "Foto Aset" });
      asset.FotoFileID = up.data.fileId; asset.FotoURL = up.data.fileUrl;
    }
    await api(id ? "updateAsset" : "saveAsset", { asset });
    await refreshAll();
    closeModal(); toast("Aset berhasil disimpan."); switchTab("aset");
  } catch(e){} finally { loading(false); }
}
function fileToBase64(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
async function delAset(id){
  const c = await Swal.fire({ title:"Hapus aset ini?", icon:"warning", showCancelButton:true, confirmButtonText:"Ya, Hapus", confirmButtonColor:"#dc2626" });
  if(!c.isConfirmed) return;
  loading(true);
  try { await api("deleteAsset", { id }); await refreshAll(); toast("Aset dihapus."); switchTab("aset"); } catch(e){} finally { loading(false); }
}
function printBarcode(kode, nama){
  if(!kode){ toast("Aset ini belum punya kode barang.", true); return; }
  const w = window.open("", "_blank", "width=420,height=340");
  if(!w){ toast("Popup diblokir browser.", true); return; }
  const html = "<!DOCTYPE html><html><head><title>Barcode</title>" +
    "<script src='https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js'><\/script>" +
    "<style>body{font-family:sans-serif;text-align:center;padding:24px}button{margin-top:16px;padding:10px 20px;border:0;border-radius:6px;background:#1e3a8a;color:#fff;font-weight:bold}@media print{button{display:none}}</style></head><body>" +
    "<div style='font-weight:bold;margin-bottom:8px'>" + esc(nama||"") + "</div><svg id='bc'></svg>" +
    "<div><button onclick='window.print()'>CETAK</button></div>" +
    "<script>JsBarcode('#bc'," + JSON.stringify(String(kode)) + ",{format:'CODE128',width:2,height:60,fontSize:14,margin:8});<\/script></body></html>";
  w.document.write(html); w.document.close();
}

  try { await api("saveUser", { user:{ username, nama, password:$("u-pass").value.trim()||"123456", role:$("u-role").value } }); toast("Pengguna ditambahkan."); viewPengguna(); } catch(e){} finally { loading(false); }
}
async function toggleUser(id, status){
  loading(true);
  try { await api("setUserStatus", { targetUserId:id, newStatus:status }); toast("Status diperbarui."); viewPengguna(); } catch(e){} finally { loading(false); }
}

//================= LAPORAN =================
function reportHeader(title,subtitle){
  const s=D.settings||{};
  return `<div class="print-header mb-4"><div class="flex items-center justify-between gap-4 border-b-4 border-slate-800 pb-3"><div class="w-20">${s.LogoDaerahURL?`<img src="${esc(s.LogoDaerahURL)}" class="w-16 h-16 object-contain">`:''}</div><div class="flex-1 text-center"><div class="font-black text-sm">${esc(s.NamaPemerintah||'PEMERINTAH ACEH')}</div><div class="font-black text-sm">${esc(s.NamaDinas||'DINAS PENDIDIKAN ACEH')}</div><div class="font-black text-lg">${esc(s.NamaSekolah||'SMA NEGERI 1 SEUNUDDON')}</div><div class="text-[10px]">${esc(s.AlamatSekolah||'')} · ${esc(s.Email||'')}</div></div><div class="w-20 flex justify-end">${s.LogoSekolahURL?`<img src="${esc(s.LogoSekolahURL)}" class="w-16 h-16 object-contain">`:''}</div></div><div class="text-center mt-3"><h2 class="font-black text-base">${esc(title)}</h2><p class="text-xs">${esc(subtitle||'')}</p></div></div>`;
}
function reportSignature(){const s=D.settings||{};return `<div class="print-signature mt-10 grid grid-cols-2 gap-12 text-center text-xs"><div><p>Mengetahui,</p><p class="font-bold">Kepala Sekolah</p><div class="h-20"></div><p class="font-bold underline">${esc(s.NamaKepalaSekolah||'-')}</p><p>NIP. ${esc(s.NIPKepalaSekolah||'-')}</p></div><div><p>Menyetujui,</p><p class="font-bold">Wakil Kepala Sekolah Bidang Sarana dan Prasarana</p><div class="h-20"></div><p class="font-bold underline">${esc(s.NamaWakaSarpras||'-')}</p><p>NIP. ${esc(s.NIPWakaSarpras||'-')}</p></div></div>`;}
function filterControls(prefix){return `<div class="bg-white rounded-2xl p-4 mb-4 shadow-sm border noprint grid md:grid-cols-4 gap-2"><select id="${prefix}-kib" class="p-3 bg-slate-50 border rounded-xl"><option value="Semua">Semua KIB</option>${['A','B','C','D','E','F'].map(x=>`<option>${x}</option>`).join('')}</select><select id="${prefix}-kat" class="p-3 bg-slate-50 border rounded-xl"><option value="Semua">Semua kategori</option>${D.categories.map(c=>`<option value="${esc(c.NamaKategori)}">${esc(c.NamaKategori)}</option>`).join('')}</select><select id="${prefix}-lok" class="p-3 bg-slate-50 border rounded-xl"><option value="Semua">Semua lokasi</option>${D.locations.map(l=>`<option value="${esc(l.NamaLokasi)}">${esc(l.NamaLokasi)}</option>`).join('')}</select><input id="${prefix}-q" placeholder="Cari..." class="p-3 bg-slate-50 border rounded-xl"><button onclick="refreshReport('${prefix}')" class="md:col-span-4 bg-blue-800 text-white font-black py-3 rounded-xl">Terapkan Filter</button></div>`;}
function getReportFilters(prefix){return {kib:$(prefix+'-kib').value,kategori:$(prefix+'-kat').value,lokasi:$(prefix+'-lok').value,q:$(prefix+'-q').value};}
function filteredRows(f){return D.assets.filter(a=>a.Status!=='Dihapus' && (!f.kib||f.kib==='Semua'||a.KIB===f.kib) && (!f.kategori||f.kategori==='Semua'||a.Kategori===f.kategori) && (!f.lokasi||f.lokasi==='Semua'||a.Lokasi===f.lokasi) && (!f.q||[a.KodeBarang,a.NamaBarang,a.Kategori,a.Lokasi,a.KIB].join(' ').toLowerCase().includes(f.q.toLowerCase())));}
function viewLaporan(){
  $("view").innerHTML=filterControls('lap')+`<div class="flex justify-between mb-3 noprint"><span id="lap-count" class="text-sm text-slate-500"></span><button onclick="window.print()" class="bg-blue-800 text-white font-black px-5 py-3 rounded-xl">🖨 Cetak Laporan</button></div><div id="lap-print" class="bg-white rounded-2xl p-6">${reportHeader('LAPORAN DATA INVENTARIS SARANA DAN PRASARANA','')}</div>`; refreshReport('lap'); icons();}
function refreshReport(prefix){const rows=filteredRows(getReportFilters(prefix)); if(prefix==='lap'){$('lap-count').textContent=rows.length+' aset akan dicetak.';$('lap-print').innerHTML=reportHeader('LAPORAN DATA INVENTARIS SARANA DAN PRASARANA','')+`<table class="w-full text-xs border-collapse"><thead><tr class="bg-slate-100"><th class="p-2 border">No</th><th class="p-2 border">Kode</th><th class="p-2 border">Nama Barang</th><th class="p-2 border">Kategori</th><th class="p-2 border">KIB</th><th class="p-2 border">Lokasi</th><th class="p-2 border">Jumlah</th><th class="p-2 border">Kondisi</th><th class="p-2 border">Nilai</th></tr></thead><tbody>${rows.map((a,i)=>`<tr><td class="p-2 border">${i+1}</td><td class="p-2 border">${esc(a.KodeBarang)}</td><td class="p-2 border">${esc(a.NamaBarang)}</td><td class="p-2 border">${esc(a.Kategori)}</td><td class="p-2 border">${esc(a.KIB||'-')}</td><td class="p-2 border">${esc(a.Lokasi)}</td><td class="p-2 border">${esc(a.Jumlah)} ${esc(a.Satuan||'')}</td><td class="p-2 border">${esc(a.Kondisi)}</td><td class="p-2 border text-right">${(Number(a.HargaPerolehan)||0).toLocaleString('id-ID')}</td></tr>`).join('')}</tbody></table>${reportSignature()}`;}}
function viewKIB(code){ $("view").innerHTML=filterControls('kibv')+`<div class="flex justify-end mb-3 noprint"><button onclick="window.print()" class="bg-blue-800 text-white font-black px-5 py-3 rounded-xl">🖨 Cetak KIB</button></div><div id="kib-print" class="bg-white rounded-2xl p-6"></div>`; if(code && $("kibv-kib")) $("kibv-kib").value=code; refreshKIB(); }
function refreshKIB(){const f=getReportFilters('kibv'); const rows=filteredRows(f); const label=f.kib&&f.kib!=='Semua'?`KIB ${f.kib}`:'SEMUA KIB'; $('kib-print').innerHTML=reportHeader(`KARTU INVENTARIS BARANG – ${label}`,`Data aset terfilter: ${rows.length} baris`)+`<table class="w-full text-xs border-collapse"><thead><tr class="bg-slate-100"><th class="p-2 border">No</th><th class="p-2 border">KIB</th><th class="p-2 border">Kode</th><th class="p-2 border">Nama Barang</th><th class="p-2 border">Merk/Type</th><th class="p-2 border">Tahun</th><th class="p-2 border">Jumlah</th><th class="p-2 border">Nilai</th><th class="p-2 border">Lokasi</th><th class="p-2 border">Kondisi</th></tr></thead><tbody>${rows.map((a,i)=>`<tr><td class="p-2 border">${i+1}</td><td class="p-2 border">${esc(a.KIB||'-')}</td><td class="p-2 border">${esc(a.KodeBarang)}</td><td class="p-2 border">${esc(a.NamaBarang)}</td><td class="p-2 border">${esc((a.Merk||'')+' '+(a.Type||''))}</td><td class="p-2 border">${esc(a.TahunPerolehan)}</td><td class="p-2 border">${esc(a.Jumlah)}</td><td class="p-2 border text-right">${(Number(a.HargaPerolehan)||0).toLocaleString('id-ID')}</td><td class="p-2 border">${esc(a.Lokasi)}</td><td class="p-2 border">${esc(a.Kondisi)}</td></tr>`).join('')}</tbody></table>${reportSignature()}`; icons();}
function viewKIR(){ $("view").innerHTML=filterControls('kirv')+`<div class="flex justify-end mb-3 noprint"><button onclick="window.print()" class="bg-blue-800 text-white font-black px-5 py-3 rounded-xl">🖨 Cetak KIR</button></div><div id="kir-print" class="bg-white rounded-2xl p-6"></div>`; refreshKIR(); }
function refreshKIR(){const rows=filteredRows(getReportFilters('kirv')); const groups={}; rows.forEach(a=>(groups[a.Lokasi||'Tanpa Lokasi']??=[]).push(a)); let html=reportHeader('KARTU INVENTARIS RUANGAN (KIR)',''); Object.entries(groups).forEach(([lok,items])=>{html+=`<div class="mb-8"><h3 class="font-black text-sm mb-2">RUANGAN/LOKASI: ${esc(lok)}</h3><table class="w-full text-xs border-collapse"><thead><tr class="bg-slate-100"><th class="p-2 border">No</th><th class="p-2 border">Kode Barang</th><th class="p-2 border">Nama Barang</th><th class="p-2 border">Merk/Type</th><th class="p-2 border">Tahun</th><th class="p-2 border">Jumlah</th><th class="p-2 border">Kondisi</th><th class="p-2 border">Keterangan</th></tr></thead><tbody>${items.map((a,i)=>`<tr><td class="p-2 border">${i+1}</td><td class="p-2 border">${esc(a.KodeBarang)}</td><td class="p-2 border">${esc(a.NamaBarang)}</td><td class="p-2 border">${esc((a.Merk||'')+' '+(a.Type||''))}</td><td class="p-2 border">${esc(a.TahunPerolehan)}</td><td class="p-2 border">${esc(a.Jumlah)}</td><td class="p-2 border">${esc(a.Kondisi)}</td><td class="p-2 border">${esc(a.Keterangan||'')}</td></tr>`).join('')}</tbody></table></div>`}); html+=reportSignature(); $('kir-print').innerHTML=html; icons();}

//================= PENGATURAN (ADMIN) =================
function viewPengaturan(){
  const s=D.settings||{};
  $("view").innerHTML=`<div class="bg-white rounded-2xl p-6 shadow-sm border max-w-3xl"><h4 class="font-black mb-4">Identitas Sekolah</h4><div class="grid md:grid-cols-2 gap-3">${['NamaPemerintah','NamaDinas','NamaSekolah','AlamatSekolah','Desa','Kecamatan','Kabupaten','Provinsi','NPSN','Email','Telepon','NamaKepalaSekolah','NIPKepalaSekolah','NamaWakaSarpras','NIPWakaSarpras','NamaPengurusBarang','NIPPengurusBarang'].map(k=>`<div><label class="text-[11px] font-bold text-slate-500">${k}</label><input id="s-${k}" value="${esc(s[k]||'')}" class="w-full p-3 bg-slate-50 border rounded-xl mt-1"></div>`).join('')}</div><h4 class="font-black mt-6 mb-3">Logo</h4><div class="grid md:grid-cols-2 gap-4"><div><label class="text-[11px] font-bold">Logo Sekolah</label>${s.LogoSekolahURL?`<img src="${esc(s.LogoSekolahURL)}" class="w-20 h-20 object-contain rounded-xl my-2 border">`:''}<input id="lg-sekolah" type="file" accept="image/*" class="w-full p-2 bg-slate-50 border rounded-xl"></div><div><label class="text-[11px] font-bold">Logo Daerah</label>${s.LogoDaerahURL?`<img src="${esc(s.LogoDaerahURL)}" class="w-20 h-20 object-contain rounded-xl my-2 border">`:''}<input id="lg-daerah" type="file" accept="image/*" class="w-full p-2 bg-slate-50 border rounded-xl"></div></div><button onclick="simpanSettings()" class="bg-blue-800 text-white font-black px-5 py-3 rounded-xl w-full mt-6">SIMPAN PENGATURAN</button></div>`; icons();}
async function simpanSettings(){const keys=['NamaPemerintah','NamaDinas','NamaSekolah','AlamatSekolah','Desa','Kecamatan','Kabupaten','Provinsi','NPSN','Email','Telepon','NamaKepalaSekolah','NIPKepalaSekolah','NamaWakaSarpras','NIPWakaSarpras','NamaPengurusBarang','NIPPengurusBarang'];const settings={};keys.forEach(k=>settings[k]=$("s-"+k).value.trim());loading(true,'Menyimpan pengaturan...');try{const fs=$("lg-sekolah").files[0],fd=$("lg-daerah").files[0];if(fs){const b=await fileToBase64(fs);const up=await api('uploadFile',{fileName:fs.name,base64Data:b,folderType:'Logo'});settings.LogoSekolahURL=up.data.fileUrl;}if(fd){const b=await fileToBase64(fd);const up=await api('uploadFile',{fileName:fd.name,base64Data:b,folderType:'Logo'});settings.LogoDaerahURL=up.data.fileUrl;}await api('saveSettings',{settings});await refreshAll();toast('Pengaturan disimpan.');switchTab('pengaturan');}catch(e){}finally{loading(false)}}

//================= SINKRONISASI =================
function viewSinkron(){
  $("view").innerHTML = `
    <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-100 text-center max-w-xl mx-auto">
      <div class="w-16 h-16 bg-blue-50 text-blue-700 rounded-2xl flex items-center justify-center mx-auto mb-4"><i data-lucide="refresh-cw" class="w-8 h-8"></i></div>
      <h3 class="font-black text-lg mb-2">Sinkronisasi Database</h3>
      <p class="text-sm text-slate-500 mb-6">Tarik ulang seluruh data langsung dari Google Spreadsheet.</p>
      <div class="grid grid-cols-3 gap-2 mb-6 text-left">
        <div class="bg-slate-50 rounded-xl p-3"><p class="text-[9px] font-black text-slate-400 uppercase">Aset</p><p class="text-lg font-black">${D.assets.length}</p></div>
        <div class="bg-slate-50 rounded-xl p-3"><p class="text-[9px] font-black text-slate-400 uppercase">Kategori</p><p class="text-lg font-black">${D.categories.length}</p></div>
        <div class="bg-slate-50 rounded-xl p-3"><p class="text-[9px] font-black text-slate-400 uppercase">Lokasi</p><p class="text-lg font-black">${D.locations.length}</p></div>
      </div>
      <p class="text-xs text-blue-700 font-bold mb-4" id="sync-time">Terakhir: ${esc(D.serverTime||'-')}</p>
      <button onclick="doSync()" class="w-full bg-blue-800 text-white font-black py-3 rounded-xl mb-3">🔄 SINKRONKAN SEKARANG</button>
      ${isAdmin()?`<button onclick="doBackup()" class="w-full bg-slate-700 text-white font-black py-3 rounded-xl">💾 BACKUP SPREADSHEET KE DRIVE</button>`:""}
    </div>`;
  icons();
}
async function doSync(){
  loading(true, "Menyinkronkan...");
  try { await refreshAll(); toast("Sinkronisasi berhasil."); switchTab("sinkron"); } catch(e){} finally { loading(false); }
}
async function doBackup(){
  loading(true, "Membackup spreadsheet...");
  try { const r = await api("backupDatabase"); toast("Backup dibuat: " + r.data.backupFileName); } catch(e){} finally { loading(false); }
}

//================= ROUTER =================
const RENDER = { dashboard:viewDashboard, aset:viewAset, kib:viewKIB, kir:viewKIR, kategori:viewKategori, lokasi:viewLokasi, mutasi:viewMutasi, peminjaman:viewPeminjaman, pemeliharaan:viewPemeliharaan, penghapusan:viewPenghapusan, laporan:viewLaporan, pengguna:viewPengguna, pengaturan:viewPengaturan, sinkron:viewSinkron };

//================= INIT =================
if(S && S.user){ boot(); } else { icons(); }
</script>
